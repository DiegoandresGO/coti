<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo — Sistema de Cotizaciones</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #111827 0%, #0B0F19 100%);
      padding: 20px;
      color: #FFFFFF;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 35px -5px rgba(79, 70, 229, 0.25);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(79, 70, 229, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #C7D2FE;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
    }
    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.02em;
    }
    .login-title span {
      background: linear-gradient(135deg, #818CF8 0%, #C7D2FE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--slate-400);
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: #E2E8F0;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 14px;
      color: #FFFFFF;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
      background: rgba(15, 23, 42, 1);
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.55);
    }
    .error-alert {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #FECDD3;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-helper {
      margin-top: 24px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: var(--slate-400);
      line-height: 1.5;
    }
    .info-helper strong {
      color: #A5B4FC;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-badge">🔒 ACCESO ADMINISTRATIVO RESTRINGIDO</div>
        <h1 class="login-title">PANEL DE <span>COTIZACIONES</span></h1>
        <p class="login-subtitle">Ingresa tus credenciales autorizadas para crear o modificar propuestas</p>
      </div>

      {% if error %}
      <div class="error-alert">
        <span>⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST">
        <input type="hidden" name="next" value="{{ next_url|default('/') }}">

        <div class="form-group">
          <label class="form-label" for="username">Usuario Administrador</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Usuario" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Contraseña</label>
            <span style="font-size: 11px; color: var(--slate-400); cursor: pointer;" onclick="togglePwd()">👁️ Mostrar</span>
          </div>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login">
          🔐 Iniciar Sesión en el Panel
        </button>
      </form>

      <div class="info-helper">
        <span style="font-size: 11px; color: var(--slate-500); display: block; margin-top: 6px;">
          💡 Nota: Las propuestas enviadas a clientes (<code>/cotizacion/...</code>) no solicitan clave ni login.
        </span>
      </div>
    </div>
  </div>

  <script>
    function togglePwd() {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
