<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/static/img/icon.svg">
  <meta name="theme-color" content="#4F46E5">
  <script src="/static/js/theme.js"></script>
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=7">
  <style>
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: radial-gradient(circle at top, #EEF2FF 0%, #F8FAFC 55%, #E2E8F0 100%);
    }
    [data-theme="dark"] body { background: radial-gradient(circle at top, #111827 0%, #070B14 100%); }
    .err-toggle { position: fixed; top: 16px; right: 16px; }
    .err-card {
      width: 100%; max-width: 480px; text-align: center; padding: 40px 32px;
      background: var(--surface); border: 1px solid var(--slate-200); border-radius: 20px;
      box-shadow: 0 24px 48px -16px rgba(15, 23, 42, 0.18);
    }
    [data-theme="dark"] .err-card { box-shadow: 0 24px 48px -16px rgba(0, 0, 0, 0.6), 0 0 40px -10px rgba(99, 102, 241, 0.25); }
    .err-icon {
      width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 22px; font-size: 36px;
      display: flex; align-items: center; justify-content: center;
      background: #FEF3C7; box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.10);
    }
    [data-theme="dark"] .err-icon { background: rgba(245, 158, 11, 0.16); box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.07); }
    .err-code { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: var(--slate-400); text-transform: uppercase; }
    .err-title { font-size: 23px; font-weight: 800; color: var(--slate-900); margin: 6px 0 10px; letter-spacing: -0.01em; }
    .err-text { font-size: 14.5px; color: var(--slate-600); line-height: 1.6; }
    .err-tips {
      text-align: left; margin: 22px 0 0; padding: 14px 16px; list-style: none;
      background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 12px;
      font-size: 13.5px; color: var(--slate-600); display: grid; gap: 8px;
    }
    .err-tips li { display: flex; gap: 8px; }
    .err-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    .err-brand { margin-top: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--slate-400); }
  </style>
</head>
<body>
  <button type="button" class="theme-toggle err-toggle" onclick="toggleTheme()" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro"><span class="theme-knob"></span></button>

  <main class="err-card" role="alert">
    <div class="err-icon" aria-hidden="true">{{ icon }}</div>
    <div class="err-code">Error {{ status_code }}</div>
    <h1 class="err-title">{{ title }}</h1>
    <p class="err-text">{{ message }}</p>

    {% if tips %}
    <ul class="err-tips">
      {% for tip in tips %}<li><span>•</span><span>{{ tip }}</span></li>{% endfor %}
    </ul>
    {% endif %}


    <div class="err-brand">
      <img src="/static/img/icon.svg" alt="" width="18" height="18"> Sistema de Cotizaciones
    </div>
  </main>
</body>
</html>
